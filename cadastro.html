<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DoaPet — Cadastro</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <div class="logo">DP</div>
        <span class="brand-name">DoaPet</span>
      </a>

      <nav class="nav" aria-label="Menu principal">
        <a href="index.html" class="nav-link">Início</a>
        <a href="projetos.html" class="nav-link">Campanhas</a>
        <a href="cadastro.html" class="nav-link active">Cadastro</a>
      </nav>

      <div class="right-controls">
        <button id="theme-toggle-3" class="icon-btn" aria-label="Alternar tema">🌙</button>
      </div>
    </div>
  </header>

  <main class="container form-main" data-animate>
    <h1>Cadastro de Voluntário</h1>
    <p>Preencha os dados abaixo. Entraremos em contato em até 5 dias úteis.</p>

    <form id="vol-form" class="vol-form" novalidate>
      <div class="form-row">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" required>
      </div>

      <div class="form-row">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required>
      </div>

      <div class="form-row">
        <label for="tel">Telefone</label>
        <input id="tel" name="tel" type="tel" placeholder="(xx) xxxxx-xxxx">
      </div>

      <div class="form-row">
        <label for="mensagem">Por que quer ser voluntário?</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-outline" type="reset">Limpar</button>
        <button class="btn btn-primary" type="submit">Enviar cadastro</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2025 DoaPet — ONG de Resgate Animal</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
